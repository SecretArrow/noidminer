name: E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator:
    name: E2E on emulator (ATD)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      # No native lib is built here on purpose: the app falls back to the
      # pure-Kotlin engine on x86_64, which is exactly the fallback path
      # we want covered by e2e.
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: AVD cache
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-30-atd-${{ hashFiles('.github/workflows/e2e.yml') }}
      - name: Create AVD (only when not cached)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "system-images;android-30;aosp_atd;x86_64" > /dev/null
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            -n e2e-avd -k "system-images;android-30;aosp_atd;x86_64" -d pixel_5 \
            --force > /dev/null
      - name: Run instrumented e2e
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: aosp_atd
          arch: x86_64
          profile: pixel_5
          avd-name: e2e-avd
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # x86_64 ABI so the APK is installable on the emulator; the app
          # then exercises its pure-Kotlin software engine fallback path.
          script: |
            TEST_EXIT=0
            ./gradlew :app:connectedDebugAndroidTest -Pnoid.abis=x86_64 || TEST_EXIT=$?
            adb logcat -d > e2e-logcat.txt || true
            exit $TEST_EXIT
      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logcat
          path: e2e-logcat.txt
          retention-days: 7
      - name: Upload e2e reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: app/build/reports/androidTests/
          retention-days: 7
