name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static analysis (ktlint + detekt)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ktlint
        run: |
          curl -sL -o ktlint https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
          ./ktlint "app/src/**/*.kt" --reporter=plain
      - name: detekt
        run: |
          curl -sL -o detekt-cli.jar https://github.com/detekt/detekt/releases/download/v1.23.7/detekt-cli-1.23.7-all.jar
          java -jar detekt-cli.jar --input app/src/main/java --report txt:detekt.txt || true
          if grep -qE "PotentialBugs|Coroutines" detekt.txt 2>/dev/null; then
            echo "detekt found potential bugs:"; cat detekt.txt; exit 1
          fi

  unit-tests:
    name: Unit tests (Rust golden + JVM)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Rust golden vectors (native-pow vs Python reference)
        run: |
          rustup toolchain install stable --profile minimal 2>/dev/null || true
          cargo test --manifest-path native-pow/Cargo.toml --release
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Gradle unit tests
        run: ./gradlew :app:testDebugUnitTest --continue
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          retention-days: 7

  build:
    name: Native + APK (debug artifact)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Cache Rust (registry + git + target + toolchain)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.rustup
            native-pow/target
          key: rust-${{ runner.os }}-${{ hashFiles('native-pow/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Ensure NDK 26.3
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/26.3.11579264" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" > /dev/null
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - name: Build Rust core (arm64-v8a)
        run: |
          chmod +x scripts/build-rust.sh
          ./scripts/build-rust.sh aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Assemble debug APK + Android lint
        run: ./gradlew :app:assembleDebug :app:lintDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: noidminer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: app/build/reports/
          retention-days: 7
