name: Auto-fix

# Applies ktlint formatting automatically:
#  - manually via workflow_dispatch
#  - automatically when CI fails on main
# Commits the formatted code back to main with the actions bot identity.
on:
  workflow_dispatch:
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: autofix-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  autofix:
    name: ktlint --format and commit
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'failure' &&
       github.event.workflow_run.head_branch == 'main')
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: ktlint format
        run: |
          curl -sL -o ktlint https://github.com/pinterest/ktlint/releases/download/1.5.0/ktlint
          chmod +x ktlint
          ./ktlint --format "app/src/**/*.kt" --reporter=plain || true
      - name: Commit fixes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing to fix"
          else
            git add -A
            git commit -m "style: auto-fix ktlint [skip ci]"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push
        if: steps.commit.outputs.changed == 'true'
        run: git push origin main
      - name: Report residual failure
        if: failure()
        run: |
          cat > issue.md << 'EOF'
          ---
          title: Auto-fix failed
          labels: ci, bug
          ---

          The Auto-fix workflow could not resolve the failure automatically.
          - Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Please review the CI output and fix manually.
          EOF
          echo "Auto-fix itself failed — see the workflow log above."
