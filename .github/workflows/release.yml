name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK → GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Rust toolchain (preinstalled rustup + android target)
        run: |
          rustup toolchain install stable --profile minimal 2>/dev/null || true
          rustup default stable
          rustup target add aarch64-linux-android
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.rustup
            native-pow/target
          key: rust-${{ runner.os }}-${{ hashFiles('native-pow/Cargo.toml') }}
          restore-keys: rust-${{ runner.os }}-
      - name: Ensure NDK 26.3
        run: |
          if [ ! -d "$ANDROID_HOME/ndk/26.3.11579264" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;26.3.11579264" > /dev/null
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> "$GITHUB_ENV"
      - name: Build Rust core (arm64-v8a)
        run: |
          chmod +x scripts/build-rust.sh
          ./scripts/build-rust.sh aarch64-linux-android
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Decode signing keystore
        env:
          NOID_KEYSTORE_BASE64: ${{ secrets.NOID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$NOID_KEYSTORE_BASE64" ]; then
            echo "$NOID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/noidminer.jks"
            echo "NOID_KEYSTORE_FILE=$RUNNER_TEMP/noidminer.jks" >> "$GITHUB_ENV"
          else
            echo "NOID_KEYSTORE_FILE=" >> "$GITHUB_ENV"
            echo "::warning::No signing secret set — APK would be UNSIGNED; the hard gate below will fail the job."
          fi
      - name: Assemble release
        env:
          # Both delivery paths are wired: the decoded file (NOID_KEYSTORE_FILE)
          # and the raw base64 (NOID_KEYSTORE_BASE64) — Gradle accepts either.
          NOID_KEYSTORE_FILE: ${{ env.NOID_KEYSTORE_FILE }}
          NOID_KEYSTORE_BASE64: ${{ secrets.NOID_KEYSTORE_BASE64 }}
          NOID_KEYSTORE_PASSWORD: ${{ secrets.NOID_KEYSTORE_PASSWORD }}
          NOID_KEY_ALIAS: ${{ secrets.NOID_KEY_ALIAS }}
          NOID_KEY_PASSWORD: ${{ secrets.NOID_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Verify APK is signed (hard gate)
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          if ! keytool -printcert -jarfile "$APK" > /dev/null 2>&1; then
            echo "::error::Release APK is NOT signed — refusing to publish (this was the v1.0.0 install bug)"
            exit 1
          fi
          echo "APK signature OK:"
          keytool -printcert -jarfile "$APK" | head -6
      - name: Checksums
        run: |
          cd app/build/outputs/apk/release
          sha256sum *.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Rename artifact
        run: |
          VERSION="${GITHUB_REF_NAME:-nightly}"
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/NoidMiner-${VERSION}-arm64.apk"
          cp app/build/outputs/apk/release/SHA256SUMS.txt dist/ 2>/dev/null || true
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "NoidMiner $GITHUB_REF_NAME" \
            --notes "Parano1d (NOID) Poseidon2b miner untuk Android — arm64-v8a.

          - CPU native (ARM PMULL) + GPU OpenCL (self-check otomatis)
          - Background mining (foreground service + guards)
          - Mode: Pool (Stratum SV1 TCP/TLS) / Solo node (JSON-RPC)
          - Signed APK — v1+v2+v3, 16 KB page-size ready (Android 15+)
          Lihat README untuk cara instal & troubleshooting." || \
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
      - name: Upload APK artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: noidminer-release-apk
          path: dist/
          retention-days: 30
